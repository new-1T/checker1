<body>
  <header class="header">
    <div class="header-content">
      <div class="header-logo">
        <img src="https://www.gmailchecklive.com/logo.webp" alt="Gmail Checker" onerror="this.style.display='none'"/>
        <h1>Gmail Checker</h1>
      </div>
      <div class="header-right">
        <span style="font-size:0.8rem;color:var(--text-light)">Free Gmail Validation</span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="checker-card">
      <div class="checker-card-header">
        <div class="checker-icon-wrap">
          <div class="checker-icon"><i class="fas fa-envelope"></i></div>
          <div class="badge"><i class="fas fa-plus"></i></div>
        </div>
        <h2>Gmail Checker</h2>
        <p>Validate Gmail accounts in bulk</p>
      </div>

      <textarea class="email-textarea" id="emailInput" placeholder="Enter gmail accounts for check" oninput="updateCount()"></textarea>

      <div class="toolbar">
        <div class="count-badge">
          <i class="fas fa-envelope" style="font-size:0.75rem"></i>
          Emails: <span id="emailCount">0</span>
        </div>
        <button class="btn-clear" onclick="clearInput()">
          <i class="fas fa-trash-alt"></i> Clear Input
        </button>
      </div>

      <button class="btn-start" id="startBtn" onclick="startCheck()">
        <i class="fas fa-play"></i> START CHECK <i class="fas fa-shield-alt"></i>
      </button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label">
          <span id="progressLabel">Processing...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="results-grid">
      <div class="result-card live">
        <div class="result-card-header">
          <div class="result-icon-wrap">
            <div class="result-icon live"><i class="fas fa-heart"></i></div>
            <div class="result-badge live" id="liveBadge">0</div>
          </div>
          <h3>Live Emails</h3>
          <div class="count-pill live">
            <i class="fas fa-check-circle"></i> Live: <span id="liveCount">0</span>
          </div>
        </div>
        <textarea class="result-textarea" id="liveTextarea" readonly placeholder="Live emails will appear here..."></textarea>
        <button class="btn-copy-all live" onclick="copyAll('live')">
          <i class="fas fa-copy"></i> Copy All Live Emails
        </button>
        <div class="export-btns">
          <button class="btn-export txt" onclick="exportTxt('live')"><i class="fas fa-file-alt"></i> TXT</button>
          <button class="btn-export excel" onclick="exportExcel('live')"><i class="fas fa-file-excel"></i> Excel</button>
        </div>
      </div>

      <div class="result-card die">
        <div class="result-card-header">
          <div class="result-icon-wrap">
            <div class="result-icon die"><i class="fas fa-heart-broken"></i></div>
            <div class="result-badge die" id="dieBadge">0</div>
          </div>
          <h3>Die Emails</h3>
          <div class="count-pill die">
            <i class="fas fa-times-circle"></i> Die: <span id="dieCount">0</span>
          </div>
        </div>
        <textarea class="result-textarea" id="dieTextarea" readonly placeholder="Invalid emails will appear here..."></textarea>
        <button class="btn-copy-all die" onclick="copyAll('die')">
          <i class="fas fa-copy"></i> Copy All Die Emails
        </button>
        <div class="export-btns">
          <button class="btn-export txt" onclick="exportTxt('die')"><i class="fas fa-file-alt"></i> TXT</button>
          <button class="btn-export excel" onclick="exportExcel('die')"><i class="fas fa-file-excel"></i> Excel</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Gmail Checker. All rights reserved.</p>
    <p>Professional Gmail live checker tool for bulk email verification.</p>
  </footer>

<script>
  let liveEmails = [];
  let dieEmails  = [];
  let isRunning  = false;

  function parseEmails(raw) {
    return raw.split(/\n|,|;/).map(l => l.trim()).filter(l => l.length > 0);
  }
  
  function updateCount() {
    const emails = parseEmails(document.getElementById('emailInput').value);
    document.getElementById('emailCount').textContent = emails.length;
  }

  function clearInput() {
    document.getElementById('emailInput').value = '';
    document.getElementById('emailCount').textContent = '0';
  }

  function setProgress(pct, label) {
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = Math.round(pct) + '%';
    if (label) document.getElementById('progressLabel').textContent = label;
  }

  function updateResults() {
    document.getElementById('liveTextarea').value = liveEmails.join('\n');
    document.getElementById('liveCount').textContent = liveEmails.length;
    document.getElementById('liveBadge').textContent = liveEmails.length;
    document.getElementById('dieTextarea').value = dieEmails.join('\n');
    document.getElementById('dieCount').textContent = dieEmails.length;
    document.getElementById('dieBadge').textContent = dieEmails.length;
  }

  async function startCheck() {
    if (isRunning) return;
    const raw = document.getElementById('emailInput').value.trim();
    if (!raw) { alert('Please enter at least one email address.'); return; }

    const lines = parseEmails(raw);
    liveEmails = [];
    dieEmails  = [];
    isRunning  = true;
    updateResults();

    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = true;
    startBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Checking...';

    document.getElementById('progressWrap').classList.add('active');
    setProgress(0, 'Starting...');

    // تم تصغير حجم الدفعة إلى 5 لضمان عدم انقطاع الاتصال بسبب Vercel Timeout
    const batchSize = 5; 
    const totalBatches = Math.ceil(lines.length / batchSize);

    for (let i = 0; i < totalBatches; i++) {
      const batch = lines.slice(i * batchSize, (i + 1) * batchSize);
      
      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emails: batch })
        });

        if (!response.ok) throw new Error('Server Error');
        const data = await response.json();
        
        if (data.success && data.results) {
          data.results.forEach(item => {
            const email = item.email || '';
            if (!email) return;
            
            const verdict = item.verdict || '';
            if (verdict === 'valid') {
              if(!liveEmails.includes(email)) liveEmails.push(email);
            } else {
              if(!dieEmails.includes(email)) dieEmails.push(email);
            }
          });
          updateResults();
        }
      } catch (err) {
        console.error("Batch error:", err);
      }
      setProgress(((i + 1) / totalBatches) * 100, `Processing batch ${i + 1} of ${totalBatches}...`);
    }

    setProgress(100, 'Complete ✓');
    startBtn.disabled = false;
    startBtn.innerHTML = '<i class="fas fa-play"></i> START CHECK <i class="fas fa-shield-alt"></i>';
    isRunning = false;
  }

  function copyAll(type) {
    const arr = type === 'live' ? liveEmails : dieEmails;
    if (!arr.length) { alert('No emails to copy.'); return; }
    navigator.clipboard.writeText(arr.join('\n')).then(() => {
      const btn = document.querySelector(`.btn-copy-all.${type}`);
      const orig = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
      setTimeout(() => btn.innerHTML = orig, 1500);
    });
  }

  function exportTxt(type) {
    const arr = type === 'live' ? liveEmails : dieEmails;
    if (!arr.length) return;
    const blob = new Blob([arr.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gmail_${type}.txt`;
    a.click();
  }

  function exportExcel(type) {
    const arr = type === 'live' ? liveEmails : dieEmails;
    if (!arr.length) return;
    const data = arr.map(e => ({ Email: e, Status: type.toUpperCase() }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, type === 'live' ? 'Live' : 'Die');
    XLSX.writeFile(wb, `gmail_${type}.xlsx`);
  }
</script>
